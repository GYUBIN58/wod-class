<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WOD CLASS</title>
<script type="module">
// ── Firebase 초기화 ──
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc, setDoc, getDoc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCDRFPtrlgmJ3L_c0614TPeHFv7pCabl9A",
  authDomain: "wolchon-wod.firebaseapp.com",
  projectId: "wolchon-wod",
  storageBucket: "wolchon-wod.firebasestorage.app",
  messagingSenderId: "568957870308",
  appId: "1:568957870308:web:b3e5802cc3226223e38cf1",
  measurementId: "G-RK1QYGQH6L"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── 오프라인 지속성 활성화 ──
// 오프라인에서 저장한 데이터가 인터넷 연결되면 자동으로 Firebase에 업로드됨
enableIndexedDbPersistence(db).catch(err => {
  if(err.code === 'failed-precondition') {
    console.warn('오프라인 저장: 여러 탭이 열려있으면 한 탭에서만 작동합니다');
  } else if(err.code === 'unimplemented') {
    console.warn('이 브라우저는 오프라인 저장을 지원하지 않습니다');
  }
});

window._db = db;
window._fbReady = true;

// ── Firestore 동기화 함수 ──

// 기록 저장 (로컬 + Firestore)
window.fbSaveRecord = async function(rec) {
  try {
    const recWithSchool={...rec,schoolId:(window._S?.selectedSchoolId||'wolchon')};
    await setDoc(doc(db, 'records', rec.id), recWithSchool);
  } catch(e) {
    console.warn('Firestore 저장 실패 (오프라인 저장됨):', e);
  }
};

// 체력측정 기록 저장 (오프라인 동기화용)
window.fbSaveExamRecord = async function(rec) {
  if(!window._fbReady || !window._db) return false;
  try {
    const recWithSchool={...rec,schoolId:(window._S?.selectedSchoolId||'wolchon')};
    await setDoc(doc(db, 'exam_records', rec.id), recWithSchool);
    return true;
  } catch(e) {
    console.warn('체력측정 기록 동기화 실패:', e);
    return false;
  }
};

// 기록 삭제
window.fbDeleteRecord = async function(id) {
  try {
    await deleteDoc(doc(db, 'records', id));
  } catch(e) {
    console.warn('Firestore 삭제 실패:', e);
  }
};

// 체력측정 기록 삭제
window.fbDeleteExamRecord = async function(id) {
  try {
    await deleteDoc(doc(db, 'exam_records', id));
  } catch(e) {
    console.warn('체력측정 기록 삭제 실패:', e);
  }
};

// WOD 공유 Firebase
window.fbSetSharedWod = async function(code, data) {
  try { await setDoc(doc(db,'shared_wods',code), data); } catch(e) { console.warn('WOD 공유 저장 실패:',e); }
};
window.fbGetSharedWod = async function(code) {
  try {
    const snap=await getDoc(doc(db,'shared_wods',code));
    return snap.exists()?snap.data():null;
  } catch(e) { console.warn('WOD 공유 로드 실패:',e); return null; }
};

// 교사 삭제
window.fbDeleteTeacher = async function(id) {
  try { await deleteDoc(doc(db, 'teachers', id)); } catch(e) { console.warn('교사 삭제 실패:',e); }
};

// 교사 계정 저장
window.fbSaveTeacher = async function(teacher) {
  try {
    const teacherWithSchool={...teacher,schoolId:(window._S?.selectedSchoolId||'wolchon')};
    await setDoc(doc(db, 'teachers', teacher.id), teacherWithSchool);
  } catch(e) {
    console.warn('Firestore 교사 저장 실패:', e);
  }
};

// WOD 목록 즉시 불러오기
window.fbLoadWodList = async function(tid) {
  try {
    const sid=(window._S?.selectedSchoolId||'wolchon');
    const sKey=k=>sid+'_'+k;
    // 새 키 형식으로 먼저 시도, 없으면 구버전 키로 fallback
    let snap = await getDoc(doc(db, 'wod_lists', sid+'_'+tid));
    if(!snap.exists()) snap = await getDoc(doc(db, 'wod_lists', tid));
    if(snap.exists()) {
      const fbList = snap.data().list||[];
      if(fbList.length > 0) window._stor.set(sKey('wod_list_'+tid), fbList);
    }
    let snap2 = await getDoc(doc(db, 'wod_active_ids', sid+'_'+tid));
    if(!snap2.exists()) snap2 = await getDoc(doc(db, 'wod_active_ids', tid));
    if(snap2.exists()) {
      const fbIds = snap2.data().ids||[];
      if(fbIds.length > 0) window._stor.set(sKey('wod_active_'+tid), fbIds);
    }
  } catch(e) {
    console.warn('WOD 목록 로드 실패 (로컬 데이터 사용):', e);
  }
};

// WOD 목록 저장
window.fbSaveWodList = async function(tid, list) {
  try {
    const sid=(window._S?.selectedSchoolId||'wolchon');
    await setDoc(doc(db, 'wod_lists', sid+'_'+tid), { list, schoolId:sid });
  } catch(e) {
    console.warn('Firestore WOD 목록 저장 실패:', e);
    throw e;
  }
};

// WOD 공개 목록 저장
window.fbSaveActiveWodIds = async function(tid, ids) {
  try {
    const sid=(window._S?.selectedSchoolId||'wolchon');
    await setDoc(doc(db, 'wod_active_ids', sid+'_'+tid), { ids, schoolId:sid });
  } catch(e) {
    console.warn('Firestore WOD 공개 저장 실패:', e);
  }
};

// 팀 구성 저장 (Firebase)
window.fbSaveTeamConfig = async function(cls, teamName, members) {
  try {
    const sid=(window._S?.selectedSchoolId||'wolchon');
    const docId=sid+'_'+cls+'_'+teamName;
    await setDoc(doc(db, 'team_configs', docId), {
      schoolId:sid, class:cls, teamName, members,
      updatedAt:new Date().toISOString()
    });
  } catch(e) {
    console.warn('팀 구성 저장 실패:', e);
  }
};

// 팀 구성 불러오기 (Firebase → 로컬 병합)
window.fbLoadTeamConfigs = async function() {
  try {
    const sid=(window._S?.selectedSchoolId||'wolchon');
    const stor=window._stor;
    const snap=await getDocs(collection(db, 'team_configs'));
    const byClass={};
    snap.forEach(d=>{
      const data=d.data();
      if(data.schoolId!==sid) return;
      const cls=data.class;
      if(!byClass[cls]) byClass[cls]=[];
      // 중복 팀명 제거 후 추가
      const idx=byClass[cls].findIndex(t=>t.name===data.teamName);
      if(idx>=0) byClass[cls][idx]={name:data.teamName,members:data.members};
      else byClass[cls].push({name:data.teamName,members:data.members});
    });
    // 로컬과 병합 (Firebase 우선)
    Object.entries(byClass).forEach(([cls,fbTeams])=>{
      const key=sid+'_saved_teams_'+cls;
      const local=stor.get(key,[]);
      const merged=[...fbTeams];
      local.forEach(lt=>{
        if(!merged.some(ft=>ft.name===lt.name)) merged.push(lt);
      });
      stor.set(key,merged);
    });
  } catch(e) {
    console.warn('팀 구성 로드 실패:', e);
  }
};

// 팀 구성 삭제 (Firebase)
window.fbDeleteTeamConfig = async function(cls, teamName) {
  try {
    const sid=(window._S?.selectedSchoolId||'wolchon');
    await deleteDoc(doc(db, 'team_configs', sid+'_'+cls+'_'+teamName));
  } catch(e) {
    console.warn('팀 구성 삭제 실패:', e);
  }
};

// 담당 반 저장
window.fbSaveClasses = async function(tid, classes) {
  try {
    const sid=(window._S?.selectedSchoolId||'wolchon');
    await setDoc(doc(db, 'teacher_classes', tid), { classes, schoolId:sid });
  } catch(e) {
    console.warn('Firestore 담당 반 저장 실패:', e);
  }
};

// 앱 시작 시 Firestore에서 전체 데이터 불러오기
window.fbLoadAll = async function() {
  try {
    const stor = window._stor;
    const schoolId = (window._S?.selectedSchoolId||'wolchon');
    const sKey = k => schoolId+'_'+k;

    // 기록 불러오기 (학교별)
    const recSnap = await getDocs(collection(db, 'records'));
    const fbRecs = [];
    recSnap.forEach(d => { const data=d.data(); if(!data.schoolId||data.schoolId===schoolId) fbRecs.push(data); });

    // 교사 계정 불러오기 (학교별)
    const teacherSnap = await getDocs(collection(db, 'teachers'));
    const fbTeachers = [];
    teacherSnap.forEach(d => { const data=d.data(); if(!data.schoolId||data.schoolId===schoolId) fbTeachers.push(data); });

    // WOD 불러오기 (학교별)
    const wodSnap = await getDocs(collection(db, 'wods'));
    const wodMap = {};
    wodSnap.forEach(d => { const data=d.data(); if(!data.schoolId||data.schoolId===schoolId) wodMap[d.id]=data; });

    // 담당 반 불러오기 (학교별)
    const classSnap = await getDocs(collection(db, 'teacher_classes'));
    const classMap = {};
    classSnap.forEach(d => { const data=d.data(); if(!data.schoolId||data.schoolId===schoolId) classMap[d.id]=data.classes; });

    // WOD 목록 불러오기 (학교별)
    const wodListSnap = await getDocs(collection(db, 'wod_lists'));
    const wodListMap = {};
    wodListSnap.forEach(d => { const data=d.data(); const docId=d.id;
      if(docId.startsWith(schoolId+'_')){ const tid=docId.slice(schoolId.length+1); if(!wodListMap[tid]) wodListMap[tid]=data.list||[]; }
      else if(!data.schoolId||data.schoolId===schoolId){ if(!wodListMap[docId]) wodListMap[docId]=data.list||[]; }
    });

    // WOD 공개 목록 불러오기 (학교별)
    const wodActiveSnap = await getDocs(collection(db, 'wod_active_ids'));
    const wodActiveMap = {};
    wodActiveSnap.forEach(d => { const data=d.data(); const docId=d.id;
      if(docId.startsWith(schoolId+'_')){ const tid=docId.slice(schoolId.length+1); if(!wodActiveMap[tid]) wodActiveMap[tid]=data.ids||[]; }
      else if(!data.schoolId||data.schoolId===schoolId){ if(!wodActiveMap[docId]) wodActiveMap[docId]=data.ids||[]; }
    });

    // 로컬 저장
    const recKey = sKey('wod_records');
    const localRecs2 = stor.get(recKey, []);
    const localIds2 = new Set(fbRecs.map(r => r.id));
    const merged2 = [...fbRecs];
    localRecs2.forEach(r => { if(!localIds2.has(r.id)) merged2.push(r); });
    stor.set(recKey, merged2);

    // 교사 계정 병합 (학교별)
    if(fbTeachers.length > 0) {
      const tKey = 'teacher_accounts_'+schoolId;
      const localTeachers = stor.get(tKey, []);
      const fbIds = new Set(fbTeachers.map(t => t.id));
      const mergedTeachers = [...fbTeachers];
      localTeachers.forEach(t => { if(!fbIds.has(t.id)) mergedTeachers.push(t); });
      stor.set(tKey, mergedTeachers);
    }

    // WOD 병합 (학교별)
    if(Object.keys(wodMap).length > 0) {
      const localWods = stor.get(sKey('wod_current_by_teacher'), {});
      const merged = { ...localWods, ...wodMap };
      stor.set(sKey('wod_current_by_teacher'), merged);
    }

    // 담당 반 병합 (학교별)
    if(Object.keys(classMap).length > 0) {
      const localClasses = stor.get(sKey('teacher_classes'), {});
      const mergedClasses = { ...localClasses, ...classMap };
      stor.set(sKey('teacher_classes'), mergedClasses);
    }

    // WOD 목록 병합 (학교별)
    if(Object.keys(wodListMap).length > 0) {
      Object.entries(wodListMap).forEach(([tid, list]) => {
        const localList = stor.get(sKey('wod_list_'+tid), []);
        const localIds = new Set(localList.map(w => w.id));
        const merged = [...list];
        localList.forEach(w => { if(!localIds.has(w.id)) merged.push(w); });
        stor.set(sKey('wod_list_'+tid), merged);
      });
    }

    // WOD 공개 목록 병합 (학교별)
    if(Object.keys(wodActiveMap).length > 0) {
      Object.entries(wodActiveMap).forEach(([tid, ids]) => {
        stor.set(sKey('wod_active_'+tid), ids);
      });
    }

    // 체력측정 기록 불러오기 (Firebase → 로컬 병합, 학교별)
    const examSnap = await getDocs(collection(db, 'exam_records'));
    const fbExamRecs = [];
    examSnap.forEach(d => { const data=d.data(); if(!data.schoolId||data.schoolId===schoolId) fbExamRecs.push(data); });
    if(fbExamRecs.length > 0) {
      const examStorKey = sKey('exam_records_2학년');
      const localExam = stor.get(examStorKey, []);
      const fbExamIds = new Set(fbExamRecs.map(r => r.id));
      const mergedExam = fbExamRecs.map(r => ({...r, synced:true}));
      localExam.forEach(r => { if(!fbExamIds.has(r.id)) mergedExam.push(r); });
      stor.set(examStorKey, mergedExam);
    }

    // 팀 구성 불러오기 (학교별)
    try { await window.fbLoadTeamConfigs(); } catch(e2) {}

    console.log('✅ Firestore 동기화 완료');

    // 상태 새로고침 - 현재 화면 다시 그리기
    if(window._render) {
      if(window._S) {
        const rKey=(window._S.selectedSchoolId||'wolchon')+'_wod_records';
        window._S.records = stor.get(rKey, []);
      }
      window._render();
    } else if(typeof render === 'function') {
      render();
    }
  } catch(e) {
    console.warn('Firestore 불러오기 실패 (오프라인 모드):', e);
  }
};

// 페이지 로드 시 Firebase에서 최신 데이터 불러온 후 화면 갱신
window.addEventListener('load', async () => {
  try {
    await window.fbLoadAll();
  } catch(e) {
    console.warn('초기 로드 실패, 로컬 데이터로 시작:', e);
  }
});

// 온라인 복귀 시 자동 동기화
window.addEventListener('online', () => {
  console.log('🌐 온라인 복귀 - 동기화 시작');
  window.fbLoadAll && window.fbLoadAll();

  // 체력측정 미동기화 기록 자동 업로드
  if(window.fbSaveExamRecord && window._stor) {
    const examStorKey=(window._S?.selectedSchoolId||'wolchon')+'_exam_records_2학년';
    const recs = window._stor.get(examStorKey, []);
    const unsynced = recs.filter(r => !r.synced);
    if(unsynced.length > 0) {
      console.log(`📤 체력측정 미동기화 ${unsynced.length}건 자동 업로드 시작`);
      (async () => {
        let success = 0;
        for(const r of recs) {
          if(!r.synced) {
            const ok = await window.fbSaveExamRecord(r);
            if(ok) { r.synced = true; success++; }
          }
        }
        if(success > 0) {
          window._stor.set(examStorKey, recs);
          console.log(`✅ 체력측정 ${success}건 자동 동기화 완료`);
          if(window._render) window._render();
        }
      })();
    }
  }
});
</script>

let _audioCtx=null;
function getAudioCtx(){
  if(!_audioCtx||_audioCtx.state==='closed') _audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==='suspended') _audioCtx.resume();
  return _audioCtx;
}
function playBeep(freq=880,duration=0.1,volume=0.3){
  try{
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value=freq; osc.type='sine';
    gain.gain.setValueAtTime(volume,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+duration);
  }catch(e){}
}
function speak(text){
  try{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; u.rate=1.1; u.pitch=1; u.volume=1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function mkDiv(cls,style,html){
  const d=document.createElement('div');
  if(cls)d.className=cls;
  if(style)d.style.cssText=style;
  if(html!==undefined)d.innerHTML=html;
  return d;
}
function mkBtn(cls,style,html,onclick){
  const b=document.createElement('button');
  b.className=cls;
  if(style)b.style.cssText=style;
  b.innerHTML=html;
  if(onclick)b.onclick=onclick;
  return b;
}
function mkInp(cls,attrs,oninput){
  const i=document.createElement('input');
  i.className=cls;
  Object.entries(attrs||{}).forEach(([k,v])=>{ if(k==='value')i.value=v; else i.setAttribute(k,v); });
  if(oninput)i.oninput=e=>oninput(e.target.value);
  return i;
}
function lbl(text){ return mkDiv('','color:var(--muted);font-size:11px;font-weight:700;margin-bottom:5px;margin-top:10px',text); }

  const root=document.getElementById('root');
  root.innerHTML='';

  if(S.toast){
    const t=mkDiv('toast','');
    t.style.background=S.toast.type==='success'?'var(--green)':'var(--red)';
    t.textContent=S.toast.msg;
    root.appendChild(t);
  }
}

function buildScreen(){
  if(S.screen==='schoolSelect')return buildSchoolSelect();
  if(S.screen==='login')return buildLogin();

  if(S.screen==='workout')return buildWorkout();

  if(S.screen==='rankOnly')return buildRankOnly();
  if(S.screen==='wodSim')return buildWodSim();
  if(S.screen==='superAdmin')return buildSuperAdmin();

}

function buildWodSim(){
  const tid=S.simFromStudent?(S.lTeacherId||S.user?.teacherId):(S.user?.teacherId);
  const wodList2=getWodList(tid);
  const wod=S.adminWodSimId?wodList2.find(w=>w.id===S.adminWodSimId):wodList2[0];
  if(!wod) return mkDiv('','padding:30px;text-align:center;color:var(--muted)','WOD를 찾을 수 없습니다');

  const wrap=mkDiv('','min-height:100vh;background:var(--bg);display:flex;flex-direction:column;padding:14px;padding-bottom:30px;overflow-y:auto');

  // 헤더
  const hdr=mkDiv('','display:flex;align-items:center;gap:10px;margin-bottom:14px');
  hdr.appendChild(mkBtn('','background:none;border:none;color:var(--muted);padding:10px 10px 10px 0;min-width:44px',ic.back,()=>{
    if(S.simFromStudent) setState({screen:'main',wPhase:'ready'});
    else setState({screen:'admin',adminTab:'wod'});
  }));
  hdr.appendChild(mkDiv('tf','flex:1;font-size:16px',`🎬 ${wod.title}`));
  wrap.appendChild(hdr);

  const exercises=wod.exercises||[];
  const tl=wod.timeLimit||(wod.timeLimitMin||10)*60+(wod.timeLimitSec||0);

  // 슬라이드 생성
  const slides=[];
  // 1. WOD 소개
  slides.push({type:'intro'});
  // 2. 각 운동
  exercises.forEach((ex,i)=>{
    const desc=(wod.exerciseDescs||[])[i]||'';
    slides.push({type:'exercise',exNum:i+1,exName:ex,desc,emoji:'💪'});
  });
  // 3. 완료
  slides.push({type:'ready'});

  const slide=slides[S.simSlide||0]||slides[0];
  const idx=S.simSlide||0;

  const slideCard=mkDiv('card','min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;margin-bottom:16px');

  if(slide.type==='intro'){
    const typeInfo=wod.type==='AMRAP'?`⏱ ${fmtTime(tl)} AMRAP`:wod.type==='EMOM'?`🔄 ${wod.emomRounds||3}라운드 EMOM`:`🔢 ${wod.targetSets||3}세트 ForTime`;
    slideCard.innerHTML=`
      <div style="font-size:48px;margin-bottom:12px">🏋️</div>
      <div style="font-size:22px;font-weight:900;color:var(--accent);margin-bottom:8px">${wod.title}</div>
      <div style="background:var(--asoft);border-radius:12px;padding:6px 16px;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:16px">${typeInfo}</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.7">
        ${wod.type==='AMRAP'?`${fmtTime(tl)} 동안 아래 운동을 최대한 많이 반복해요!`:wod.type==='EMOM'?`아래 운동들을 1분 안에 완료 → 남은 시간 휴식! ${wod.emomRounds||3}라운드 반복합니다!`:`아래 운동들을 ${wod.targetSets}세트 완료하세요!`}
      </div>
      <div style="width:100%;text-align:left">
        ${exercises.map((ex,i)=>`<div style="padding:5px 0;border-bottom:1px solid var(--border);font-size:13px">
          <span style="color:var(--accent);font-weight:700">${i+1}.</span> ${ex}
          ${(wod.exerciseRx||[])[i]?`<span style="color:var(--blue);font-size:11px;margin-left:6px">💪${(wod.exerciseRx||[])[i]}</span>`:''}
          ${(wod.exerciseScale||[])[i]?`<span style="color:var(--green);font-size:11px;margin-left:4px">🔧${(wod.exerciseScale||[])[i]}</span>`:''}
          ${(wod.exerciseBasic||[])[i]?`<span style="color:var(--yellow);font-size:11px;margin-left:4px">⭐${(wod.exerciseBasic||[])[i]}</span>`:''}
        </div>`).join('')}
      </div>`;
  } else if(slide.type==='exercise'){
    const rxStr=(wod.exerciseRx||[])[slide.exNum-1];
    const scStr=(wod.exerciseScale||[])[slide.exNum-1];
    const bsStr=(wod.exerciseBasic||[])[slide.exNum-1];
    slideCard.innerHTML=`
      <div style="background:var(--asoft);border-radius:12px;padding:4px 14px;font-size:11px;color:var(--accent);font-weight:700;margin-bottom:12px">운동 ${slide.exNum} / ${exercises.length}</div>
      <div style="font-size:40px;margin-bottom:8px">${slide.emoji||'💪'}</div>
      <div style="font-size:22px;font-weight:900;color:var(--accent);margin-bottom:10px">${slide.exName}</div>
      ${rxStr||scStr||bsStr?`<div style="display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap">
        ${rxStr?`<span style="background:#3b82f620;color:var(--blue);border-radius:8px;padding:4px 12px;font-size:13px;font-weight:700">💪 RxD: ${rxStr}</span>`:''}
        ${scStr?`<span style="background:#10b98120;color:var(--green);border-radius:8px;padding:4px 12px;font-size:13px;font-weight:700">🔧 Scaled: ${scStr}</span>`:''}
        ${bsStr?`<span style="background:#f59e0b20;color:var(--yellow);border-radius:8px;padding:4px 12px;font-size:13px;font-weight:700">⭐ Basic: ${bsStr}</span>`:''}
      </div>`:''}
      ${slide.desc?`<div style="font-size:13px;color:var(--text);line-height:1.8;text-align:left;white-space:pre-line;width:100%">${slide.desc}</div>`:''}`;
  } else if(slide.type==='ready'){
    slideCard.innerHTML=`
      <div style="font-size:56px;margin-bottom:12px">🔥</div>
      <div style="font-size:24px;font-weight:900;color:var(--accent);margin-bottom:8px">준비됐나요?</div>
      <div style="font-size:14px;color:var(--muted)">운동을 시작해보세요!</div>`;
  }

  wrap.appendChild(slideCard);

  // 진행 바
  const prog=mkDiv('','background:var(--border);border-radius:99px;height:4px;margin-bottom:14px;overflow:hidden');
  prog.appendChild(mkDiv('','background:var(--accent);border-radius:99px;height:100%',`width:${((idx+1)/slides.length)*100}%`));
  wrap.appendChild(prog);

  // 네비게이션
  const nav=mkDiv('','display:flex;gap:8px;align-items:center');
  nav.appendChild(mkBtn('btn-s',`flex:0.6;padding:13px;font-size:16px${idx===0?';opacity:.3':''}`,ic.back,()=>{if(idx>0){S.simSlide=idx-1;render();}}));
  nav.appendChild(mkDiv('','flex:1;text-align:center;font-size:12px;color:var(--muted)',`${idx+1} / ${slides.length}`));
  if(idx<slides.length-1){
    nav.appendChild(mkBtn('btn-p','flex:2;padding:13px;font-size:15px','다음 →',()=>{S.simSlide=idx+1;render();}));
  } else {
    nav.appendChild(mkBtn('btn-p','flex:2;padding:13px;font-size:15px','▶ 운동 시작!',()=>{
      const savedWodId=S.adminWodSimId;
      const savedFromStudent=S.simFromStudent;
      clearInterval(cdInt); clearInterval(workInt);
      setState({screen:'workout',wPhase:'ready',wCountdown:10,
        simData:null,simSlide:0,
        lWodId:savedFromStudent?savedWodId:S.lWodId,
        eRestPhase:false,eRoundLogs:[]});
    }));
  }
  wrap.appendChild(nav);
  return wrap;
}

function doHomeSearch(){
  const q=(S.homeSearch||'').trim();
  if(!q){ S.homeSearchErr='이름을 입력해주세요'; render(); return; }
  S.homeSearchErr='';
  // 현재 선택된 학교 기록에서 검색
  const recs=S.records||[];
  const result=recs.filter(r=>{
    if(r.mode==='individual'||!r.mode) return (r.name||'').includes(q);
    return (getMembers(r)||[]).some(m=>m.includes(q));
  });
  if(result.length===0){ S.homeSearchErr=`"${q}" 관련 기록이 없습니다`; S.homeSearchResult=[]; }
  else S.homeSearchResult=result;
  render();
}

// WOD 공유 코드 생성
function makeShareCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code='WOD-';
  for(let i=0;i<4;i++) code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}

async function doShareWod(wod){
  // 이미 shareCode 있으면 재사용
  const code=wod.shareCode||makeShareCode();
  const toShare={...wod, shareCode:code, sharedBy:S.user?.teacherId||'', sharedAt:new Date().toISOString()};

  // Firebase shared_wods에 저장
  try {
    if(window._fbSetSharedWod) await window._fbSetSharedWod(code, toShare);
    // 로컬 WOD에도 shareCode 저장
    const tid=S.user?.teacherId;
    const list=getWodList(tid);
    const idx=list.findIndex(w=>w.id===wod.id);
    if(idx>=0){ list[idx].shareCode=code; setWodList(tid,list); fbSaveWodList(tid,list); }

    // 클립보드 복사
    try{ await navigator.clipboard.writeText(code); showToast(`공유 코드: ${code} (복사됨!) 📋`,'success'); }
    catch(e){ showToast(`공유 코드: ${code}`,'success'); }
    render();
  } catch(e) {
    showToast('공유 실패: '+e.message,'error');
  }
}

async function doImportWod(){
  const code=(S.wodImportCode||'').trim().toUpperCase();
  if(!code){ S.wodImportMsg='코드를 입력해주세요'; S.wodImportErr=true; render(); return; }

  try {
    if(!window.fbGetSharedWod){ S.wodImportMsg='Firebase 연결 필요'; S.wodImportErr=true; render(); return; }
    const sharedWod=await window.fbGetSharedWod(code);
    if(!sharedWod){ S.wodImportMsg='❌ 코드를 찾을 수 없습니다'; S.wodImportErr=true; render(); return; }
    const tid=S.user?.teacherId;
    const list=getWodList(tid);
    // 새 id 부여해서 추가
    const newWod={...sharedWod, id:'wod_'+Date.now(), shareCode:code, importedFrom:sharedWod.sharedBy};
    delete newWod.sharedBy; delete newWod.sharedAt;
    list.push(newWod);
    setWodList(tid,list);
    fbSaveWodList(tid,list);
    S.wodImportMsg=`✅ "${sharedWod.title}" 가져오기 완료!`;
    S.wodImportErr=false;
    S.wodImportCode='';
    render();
  } catch(e) {
    S.wodImportMsg='❌ 오류: '+e.message;
    S.wodImportErr=true;
    render();
  }
}

    if(S.lStep===1){
      // Step1: 선생님 선택
      const teachers=getTeachers();
      wrap.appendChild(mkDiv('','color:var(--muted);font-size:13px;font-weight:700;margin-bottom:9px','오늘 수업 담당 선생님을 선택하세요'));
      if(teachers.length===0){
        wrap.appendChild(mkDiv('','background:var(--card);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px','아직 등록된 선생님이 없습니다.<br>교사 관리자 모드에서 회원가입해주세요.'));
      } else {
        const tg=mkDiv('','display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px');
        teachers.forEach(t=>{
          tg.appendChild(mkBtn(`chip ${S.lTeacherId===t.id?'on':''}`,`padding:13px;font-size:14px`,t.name,()=>setState({lTeacherId:t.id,lErr:''})));
        });
        wrap.appendChild(tg);
      }
      if(S.lErr)wrap.appendChild(mkDiv('','color:var(--red);font-size:12px;text-align:center;margin-bottom:7px',S.lErr));
      wrap.appendChild(mkBtn('btn-p','margin-bottom:9px','다음 →',()=>{
        if(!S.lTeacherId){setState({lErr:'선생님을 선택해주세요'});return;}
        setState({lStep:2,lErr:'',lWodId:'',wodListLoaded:false,wodListReady:false});
      }));

      // ── 내 기록 바로 보기 ──
      const lookupCard=mkDiv('card','margin-bottom:10px;border:1px solid var(--accent)20');
      lookupCard.appendChild(mkDiv('','font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px','🔍 내 기록 보기 (이름 검색)'));
      const sRow=mkDiv('','display:flex;gap:6px');
      const sInp=mkInp('inp',{type:'text',placeholder:'이름 입력 (예: 홍길동)',value:S.homeSearch||''},v=>{S.homeSearch=v;});
      sInp.addEventListener('keydown',e=>{if(e.key==='Enter')doHomeSearch();});
      sRow.appendChild(sInp);
      sRow.appendChild(mkBtn('btn-p','white-space:nowrap;padding:0 14px;font-size:13px','검색',doHomeSearch));
      lookupCard.appendChild(sRow);
      if(S.homeSearchErr) lookupCard.appendChild(mkDiv('','color:var(--red);font-size:11px;margin-top:5px',S.homeSearchErr));
      wrap.appendChild(lookupCard);

      // 검색 결과
      if(S.homeSearchResult&&S.homeSearchResult.length>0){
        const q=S.homeSearch||'';
        const res=S.homeSearchResult;
        const today=new Date().toISOString().slice(0,10);
        const todayRecs=res.filter(r=>r.date&&r.date.slice(0,10)===today);

        if(todayRecs.length>0){
          const todayCard=mkDiv('card','margin-bottom:8px');
          todayCard.appendChild(mkDiv('','font-size:12px;font-weight:700;margin-bottom:7px',`📊 오늘 기록 (${todayRecs.length}건)`));
          todayRecs.forEach(r=>{
            const isTeam=r.mode==='team';
            const label=isTeam?`${r.class} ${r.team}`:`${r.class} ${r.name}`;
            const members=isTeam?(getMembers(r)||[]).join(' · '):'';
            const diffLabel=r.difficulty==='scaled'?'🔧':r.difficulty==='basic'?'⭐':'💪';
            const score=r.wodType==='AMRAP'?`${r.sets||0}S ${r.lastExIdx>=0&&r.lastExName?'📍'+r.lastExName+(r.reps?' '+r.reps+'개':''):r.reps?'+'+r.reps+'개':''}`:r.wodType==='EMOM'?`${r.sets||0}R`:fmtTime(r.time||0);
            const rc=mkDiv('','display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border)');
            rc.innerHTML=`<div style="flex:1">
              <div style="font-size:12px;font-weight:700">${label} ${diffLabel}</div>
              ${members?`<div style="font-size:10px;color:var(--muted)">${members}</div>`:''}
              <div style="font-size:10px;color:var(--muted)">${r.wodTitle||''}</div>
            </div>
            <div style="font-weight:900;font-size:14px;color:${r.wodType==='AMRAP'?'var(--accent)':r.wodType==='EMOM'?'var(--green)':'var(--blue)'}">${score}</div>`;
            todayCard.appendChild(rc);
          });
          wrap.appendChild(todayCard);
        }

        // 성장 그래프
        const wodGroups={};
        res.sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(r=>{
          const key=(r.wodTitle||'기타')+'__'+(r.wodType||'');
          if(!wodGroups[key])wodGroups[key]=[];
          wodGroups[key].push(r);
        });
        const growCard=mkDiv('card','margin-bottom:8px');
        growCard.appendChild(mkDiv('','font-size:12px;font-weight:700;margin-bottom:7px','📈 성장 그래프'));
        Object.entries(wodGroups).forEach(([key,wRecs])=>{
          const wodType=wRecs[0].wodType;
          const wodTitle=wRecs[0].wodTitle||'기타';
          const mini=mkDiv('','margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)');
          if(wodType==='AMRAP'){
            const maxS=Math.max(...wRecs.map(r=>r.sets||0));
            const trend=wRecs.length>1?(wRecs[wRecs.length-1].sets||0)-(wRecs[0].sets||0):0;
            mini.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
              <span style="font-size:11px;font-weight:700">${wodTitle}</span>
              <span style="font-size:10px;color:${trend>0?'var(--green)':trend<0?'var(--red)':'var(--muted)'};font-weight:700">${trend>0?'↑+'+trend:trend<0?'↓'+trend:'→'} 최고 ${maxS}S</span>
            </div>
            <div style="display:flex;gap:2px;align-items:flex-end;height:44px">
              ${wRecs.slice(-10).map((r,i,arr)=>{
                const prev=i>0?arr[i-1].sets||0:null;
                const cur=r.sets||0;
                const color=prev===null?'var(--accent)':cur>prev?'var(--green)':cur<prev?'var(--red)':'var(--accent)';
                return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px">
                  <div style="font-size:7px;color:${color};font-weight:700">${cur}</div>
                  <div style="width:100%;border-radius:2px 2px 0 0;background:${color};height:${maxS>0?(cur/maxS)*32:3}px;min-height:3px"></div>
                  <div style="font-size:6px;color:var(--muted)">${fmtDate(r.date)}</div>
                </div>`;
              }).join('')}
            </div>`;
          } else if(wodType==='EMOM'){
            const maxR=Math.max(...wRecs.map(r=>r.sets||0));
            const trend=wRecs.length>1?(wRecs[wRecs.length-1].sets||0)-(wRecs[0].sets||0):0;
            mini.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
              <span style="font-size:11px;font-weight:700">${wodTitle}</span>
              <span style="font-size:10px;color:${trend>0?'var(--green)':trend<0?'var(--red)':'var(--muted)'};font-weight:700">${trend>0?'↑+'+trend:trend<0?'↓'+trend:'→'} 최고 ${maxR}R</span>
            </div>
            <div style="display:flex;gap:2px;align-items:flex-end;height:44px">
              ${wRecs.slice(-10).map((r,i,arr)=>{
                const prev=i>0?arr[i-1].sets||0:null;
                const cur=r.sets||0;
                const color=prev===null?'var(--green)':cur>prev?'var(--green)':cur<prev?'var(--red)':'var(--green)';
                return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px">
                  <div style="font-size:7px;color:${color};font-weight:700">${cur}</div>
                  <div style="width:100%;border-radius:2px 2px 0 0;background:${color};height:${maxR>0?(cur/maxR)*32:3}px;min-height:3px"></div>
                  <div style="font-size:6px;color:var(--muted)">${fmtDate(r.date)}</div>
                </div>`;
              }).join('')}
            </div>`;
          } else {
            const times=wRecs.map(r=>r.time||0).filter(t=>t>0);
            if(times.length===0) return;
            const minT=Math.min(...times);
            const maxT=Math.max(...times);
            const trend=wRecs.length>1?(wRecs[0].time||0)-(wRecs[wRecs.length-1].time||0):0;
            mini.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
              <span style="font-size:11px;font-weight:700">${wodTitle}</span>
              <span style="font-size:10px;color:${trend>0?'var(--green)':trend<0?'var(--red)':'var(--muted)'};font-weight:700">${trend>0?'↓단축':trend<0?'↑증가':'→'} 최고 ${fmtTime(minT)}</span>
            </div>
            <div style="display:flex;gap:2px;align-items:flex-end;height:44px">
              ${wRecs.slice(-10).map((r,i,arr)=>{
                const prev=i>0?arr[i-1].time||0:null;
                const cur=r.time||0;
                const color=prev===null?'var(--blue)':cur<prev?'var(--green)':cur>prev?'var(--red)':'var(--blue)';
                const h=maxT>0?((maxT-cur)/Math.max(maxT-minT,1))*32+6:6;
                return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px">
                  <div style="font-size:6px;color:${color};font-weight:700">${fmtTime(cur)}</div>
                  <div style="width:100%;border-radius:2px 2px 0 0;background:${color};height:${h}px;min-height:3px"></div>
                  <div style="font-size:6px;color:var(--muted)">${fmtDate(r.date)}</div>
                </div>`;
              }).join('')}
            </div>`;
          }
          growCard.appendChild(mini);
        });
        wrap.appendChild(growCard);
      }

    } else if(S.lStep===2){
      // Step2: WOD 선택
      const teacher=findTeacher(S.lTeacherId);
      const tid=S.lTeacherId;

      // Firebase에서 WOD 목록 항상 최신으로 로드
      if(!S.wodListLoaded){
        S.wodListLoaded=true;
        S.wodListReady=false;
        if(window.fbLoadWodList){
          window.fbLoadWodList(tid).then(()=>{S.wodListReady=true;render();});
        } else {
          S.wodListReady=true;
        }
        render();
        return wrap;
      }

      // 로딩 중이면 스피너 표시
      if(!S.wodListReady){
        wrap.appendChild(mkDiv('','text-align:center;padding:40px',
          `<div style="font-size:13px;color:var(--muted)">WOD 불러오는 중...</div>`));
        wrap.appendChild(mkBtn('btn-s','margin-top:10px','← 뒤로',()=>setState({lStep:1,lErr:'',wodListLoaded:false,wodListReady:false})));
        return wrap;
      }

      const wodList=getWodList(tid);
      const activeIds=getActiveWodIds(tid);
      const visibleWods=wodList.filter(w=>activeIds.includes(w.id));

      const hdr=mkDiv('','display:flex;align-items:center;gap:7px;margin-bottom:12px;background:var(--card);border-radius:12px;padding:9px 12px',
        `<div style="font-size:16px">👨‍🏫</div><div style="flex:1"><div style="font-size:13px;font-weight:700">${teacher?.name||'선생님'}</div></div>`);
      hdr.appendChild(mkBtn('','background:none;border:none;color:var(--muted);font-size:11px','변경',()=>setState({lStep:1,lErr:'',wodListLoaded:false,wodListReady:false})));
      wrap.appendChild(hdr);

      wrap.appendChild(mkDiv('','color:var(--muted);font-size:13px;font-weight:700;margin-bottom:9px','오늘 WOD를 선택하세요'));

      if(visibleWods.length===0){
        wrap.appendChild(mkDiv('','background:var(--card);border-radius:14px;padding:20px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px','아직 공개된 WOD가 없습니다.<br>선생님께 문의해주세요 😊'));
        wrap.appendChild(mkBtn('btn-s','','← 뒤로',()=>setState({lStep:1,lErr:'',wodListLoaded:false,wodListReady:false})));
      } else {
        visibleWods.forEach(w=>{
          const tl=w.timeLimit||(w.timeLimitMin||10)*60+(w.timeLimitSec||0);
          const isInd=w.teamMode==='individual';
          const isSelected=S.lWodId===w.id;
          const wId=w.id;

          const cardWrap=mkDiv('','margin-bottom:10px');
          cardWrap.innerHTML=`
            <div onclick="window._selectWod('${wId}')" style="width:100%;text-align:left;background:var(--card);border-radius:14px;padding:13px;border:2px solid ${isSelected?'var(--accent)':'var(--border)'};cursor:pointer;box-sizing:border-box">
              <div style="font-weight:700;font-size:14px;margin-bottom:5px;color:var(--text)">${w.title}</div>
              <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">
                <span class="badge bo">${w.type}</span>
                <span class="badge ${isInd?'bg':'bb'}">${isInd?'🏃 개인전':'👥 팀전'}</span>
                ${w.type==='AMRAP'?`<span class="badge" style="background:var(--card2);color:var(--muted)">${fmtTime(tl)}</span>`:w.type==='EMOM'?`<span class="badge" style="background:var(--card2);color:var(--muted)">${w.emomRounds||3}라운드</span>`:`<span class="badge" style="background:var(--card2);color:var(--muted)">${w.targetSets}세트</span>`}
              </div>
              <div>${(w.exercises||[]).map((ex,i)=>`<div style="font-size:11px;color:var(--muted);padding:1px 0">${i+1}. ${ex}${(w.exerciseRx||[])[i]?" <span style=\"color:var(--blue);font-size:10px\">💪"+(w.exerciseRx||[])[i]+"</span>":""}${(w.exerciseScale||[])[i]?" <span style=\"color:var(--green);font-size:10px\">🔧"+(w.exerciseScale||[])[i]+"</span>":""}${(w.exerciseBasic||[])[i]?" <span style=\"color:var(--yellow);font-size:10px\">⭐"+(w.exerciseBasic||[])[i]+"</span>":""}</div>`).join('')}</div>
            </div>`;
          wrap.appendChild(cardWrap);
        });
      }

      if(S.lErr)wrap.appendChild(mkDiv('','color:var(--red);font-size:12px;text-align:center;margin-bottom:7px',S.lErr));
      if(visibleWods.length>0){
        wrap.appendChild(mkBtn('btn-p','margin-top:4px;margin-bottom:7px','다음 →',()=>{
          if(!S.lWodId){setState({lErr:'WOD를 선택해주세요'});return;}
          setState({lStep:3,lErr:''});
        }));
        wrap.appendChild(mkBtn('btn-s','','← 뒤로',()=>setState({lStep:1,lErr:'',wodListLoaded:false,wodListReady:false})));
      }

    } else {
      // Step3: 반 + 팀/이름
      const selWod=S.lWodId==='__default__'
        ?getWodForTeacher(S.lTeacherId)
        :(getWodList(S.lTeacherId).find(w=>w.id===S.lWodId)||getWodForTeacher(S.lTeacherId));
      const isInd=selWod.teamMode==='individual';
      const tc=selWod.teamCount||8;
      const teacher=findTeacher(S.lTeacherId);
      const myClasses=getClassesForTeacher(S.lTeacherId);

      const hdr=mkDiv('','display:flex;align-items:center;gap:7px;margin-bottom:12px;background:var(--card);border-radius:12px;padding:9px 12px',
        `<div style="font-size:16px">👨‍🏫</div><div style="flex:1"><div style="font-size:13px;font-weight:700">${teacher?.name||'선생님'}</div><div style="font-size:10px;color:var(--muted)">${selWod.title} · ${isInd?'개인전':'팀전'}</div></div>`);
      hdr.appendChild(mkBtn('','background:none;border:none;color:var(--muted);font-size:11px','변경',()=>setState({lStep:2,lErr:'',wodListLoaded:false,wodListReady:false})));
      wrap.appendChild(hdr);

      wrap.appendChild(lbl('반 선택'));
      // 담당 반 있는 학년만 탭 표시
      const availGrades=['1','2','3'].filter(g=>myClasses.some(cls=>cls.startsWith(g+'-')));
      if(availGrades.length===0){
        wrap.appendChild(mkDiv('card','text-align:center;color:var(--muted);padding:20px','담당 반이 설정되지 않았습니다.<br>선생님께 문의해주세요 😊'));
        wrap.appendChild(mkBtn('btn-s','margin-top:10px','← 뒤로',()=>setState({lStep:2,lErr:''})));
        return wrap;
      }
      if(!availGrades.includes(S.lGrade||'1')) S.lGrade=availGrades[0];
      if(availGrades.length>1){
        const gradeTab=mkDiv('','display:flex;gap:6px;margin-bottom:8px');
        availGrades.forEach(gv=>{
          const isOn=(S.lGrade||availGrades[0])===gv;
          gradeTab.appendChild(mkBtn(`chip ${isOn?'on':''}`,`flex:1;font-size:13px;padding:9px`,gv+'학년',()=>setState({lGrade:gv,lCls:'',lErr:''})));
        });
        wrap.appendChild(gradeTab);
      }
      const gradeClasses=myClasses.filter(cls=>cls.startsWith((S.lGrade||availGrades[0])+'-'));
      const cg=mkDiv('','display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px');
      gradeClasses.forEach(cls=>{
        cg.appendChild(mkBtn(`chip ${S.lCls===cls?'on':''}`,`font-size:11px;padding:7px 2px`,cls,()=>setState({lCls:cls,lErr:''})));
      });
      wrap.appendChild(cg);

      if(isInd){
        wrap.appendChild(lbl('이름 입력'));
        const ni=mkInp('inp',{type:'text',placeholder:'이름',value:S.lName},v=>{S.lName=v});
        ni.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
        wrap.appendChild(ni);
      } else {
        // 저장된 팀 목록 가져오기 (새키/구키 모두 확인)
        const newKey=schoolKey('saved_teams_'+S.lCls);
        const oldKey='saved_teams_'+S.lCls;
        const savedTeamsNew=stor.get(newKey,[]);
        const savedTeamsOld=stor.get(oldKey,[]);
        // 구버전 데이터가 있으면 새 키로 마이그레이션
        if(savedTeamsOld.length>0&&savedTeamsNew.length===0){
          stor.set(newKey,savedTeamsOld);
          stor.set(oldKey,null);
        }
        const savedTeams=stor.get(newKey,[]);
        const savedTeamNames=savedTeams.map(t=>t.name);

        wrap.appendChild(lbl('팀 선택'));

        // 저장된 팀 목록 (이름으로 바로 선택)
        if(savedTeams.length>0){
          wrap.appendChild(mkDiv('','font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px','📋 저장된 팀'));
          const savedGrid=mkDiv('','display:flex;flex-direction:column;gap:5px;margin-bottom:10px');
          savedTeams.forEach(st=>{
            const isOn=S.lTeam===st.name&&S.lTeamMode==='saved';
            const row=mkDiv(`chip ${isOn?'on':''}`,`display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer`);
            row.innerHTML=`<div><div style="font-weight:700;font-size:13px">${st.name}</div><div style="font-size:10px;color:var(--muted);margin-top:1px">${st.members.join(' · ')}</div></div><span style="color:var(--green);font-size:18px">→</span>`;
            row.onclick=()=>setState({lTeam:st.name,lMembers:[...st.members],lTeamMode:'saved',lErr:''});
            savedGrid.appendChild(row);
          });
          wrap.appendChild(savedGrid);
          wrap.appendChild(mkDiv('','font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px','➕ 새 팀 구성'));
        }

        // 팀 번호 선택 (새 팀 만들기용)
        const tg2=mkDiv('','display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px');
        makeTeams(tc).forEach(t=>{
          const isOn=S.lTeam===t&&S.lTeamMode==='new';
          tg2.appendChild(mkBtn(`chip ${isOn?'on':''}`,`font-size:11px;padding:7px 2px`,t,()=>{
            setState({lTeam:t,lMembers:[],lTeamMode:'new',lErr:''});
          }));
        });
        wrap.appendChild(tg2);

        // 저장된 팀 멤버 표시 or 입력
        if(S.lTeam){
          const saved=savedTeams.find(st=>st.name===S.lTeam);
          if(saved){
            wrap.appendChild(mkDiv('','font-size:11px;color:var(--green);font-weight:700;margin-bottom:6px','✅ 저장된 팀 자동 로드됨'));
          }
        }

        wrap.appendChild(lbl('참여 팀원 입력 (최소 1명)'));
        const mr=mkDiv('','display:flex;gap:6px;margin-bottom:7px');
        const mi=mkInp('inp',{type:'text',placeholder:'팀원 이름',value:S.lMemberInput},v=>{S.lMemberInput=v});
        mi.addEventListener('keydown',e=>{if(e.key==='Enter')addMember()});
        mr.appendChild(mi);
        mr.appendChild(mkBtn('btn-g','width:44px;border-radius:11px',ic.plus,addMember));
        wrap.appendChild(mr);
        if(S.lMembers.length>0){
          const ml=mkDiv('','display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px');
          S.lMembers.forEach((m,i)=>{
            const tag=mkDiv('','display:flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:4px 9px;font-size:12px',`<span>${m}</span>`);
            tag.appendChild(mkBtn('','background:none;border:none;color:var(--red);padding:0',ic.trash,()=>{S.lMembers.splice(i,1);render();}));
            ml.appendChild(tag);
          });
          wrap.appendChild(ml);
          // 팀 저장 버튼
          if(S.lTeam && S.lMembers.length>0){
            const teamKey=schoolKey('saved_teams_'+S.lCls);
            const isAlreadySaved=savedTeams.some(st=>st.name===S.lTeam&&JSON.stringify(st.members)===JSON.stringify(S.lMembers));
            if(!isAlreadySaved){
          // 팀 이름 입력 후 저장
          if(S.lTeam && S.lMembers.length>0){

// ── 마스터 코드 해시 검증 (코드 원문을 소스에 노출하지 않음) ──
// 접근 코드의 SHA-256 해시값
const MASTER_CODE_HASH='287ee01c1bb5fab6c456f20a1c0459b6d05e26851fa3be5da36e0e816c354db1';
async function hashCode(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function checkMasterCode(){
  hashCode(S.lMasterCode||'').then(h=>{
    if(h===MASTER_CODE_HASH){
      setState({lAdminMode:true,lErr:'',lShowMasterInput:false,lMasterCode:'',lMasterErr:''});
    } else {
      setState({lMasterErr:'접근 코드가 틀렸습니다'});
    }
  });
}

function doSignup(){
  const {lSignupName:name,lSignupId:id,lSignupPw:pw,lSignupPw2:pw2}=S;
  hashCode(S.lMasterCode||'').then(h=>{
    if(h!==MASTER_CODE_HASH){setState({lSignupErr:'접근 코드가 틀렸습니다'});return;}
    if(!name.trim()){setState({lSignupErr:'이름을 입력해주세요'});return;}
    if(!id){setState({lSignupErr:'아이디를 입력해주세요'});return;}
    if(pw.length<4){setState({lSignupErr:'비밀번호는 4자 이상이어야 합니다'});return;}
    if(pw!==pw2){setState({lSignupErr:'비밀번호가 일치하지 않습니다'});return;}
    const teachers=getTeachers();
    if(teachers.find(t=>t.id===id)){setState({lSignupErr:'이미 사용 중인 아이디입니다'});return;}
    const newTeacher={id,name:name.trim(),password:pw,createdAt:new Date().toISOString()};
    teachers.push(newTeacher);
    saveTeachers(teachers);
    fbSaveTeacher(newTeacher); // Firebase 동기화
    showToast('회원가입 완료! 로그인해주세요 ✅');
    setState({lSignupMode:false,lAdminMode:true,lAdminId:id,lAdminPw:'',lSignupErr:'',lSignupName:'',lSignupId:'',lSignupPw:'',lSignupPw2:''});
  });
}

function addMember(){
  if(!S.lMemberInput.trim())return;
  if(!S.lMembers.includes(S.lMemberInput.trim()))S.lMembers=[...S.lMembers,S.lMemberInput.trim()];
  S.lMemberInput='';render();
}

function doLogin(){
  const selWod=S.lWodId==='__default__'
    ?getWodForTeacher(S.lTeacherId)
    :(getWodList(S.lTeacherId).find(w=>w.id===S.lWodId)||getWodForTeacher(S.lTeacherId));
  const isInd=selWod.teamMode==='individual';
  if(!S.lCls){setState({lErr:'반을 선택해주세요'});return;}
  if(isInd){
    if(!S.lName.trim()){setState({lErr:'이름을 입력해주세요'});return;}
    setState({user:{class:S.lCls,name:S.lName.trim(),team:'개인전',members:[S.lName.trim()],mode:'individual',teacherId:S.lTeacherId,selectedWodId:S.lWodId||'__default__'},screen:'main',tab:'home',lErr:''});
  } else {
    if(!S.lTeam){setState({lErr:'팀을 선택해주세요'});return;}
    if(S.lMembers.length===0){setState({lErr:'팀원을 최소 1명 입력해주세요'});return;}
    setState({user:{class:S.lCls,team:S.lTeam,members:S.lMembers,mode:'team',teacherId:S.lTeacherId,selectedWodId:S.lWodId||'__default__'},screen:'main',tab:'home',lErr:''});
  }
}

function doAdminLogin(){
  const t=findTeacher(S.lAdminId);
  if(t&&t.password===S.lAdminPw){
    const adminWod=getWodForTeacher(t.id);
    const adminClassList=getTeacherClasses(t.id)||[];
    setState({user:{class:'ALL',team:'교사',name:t.name,teacherId:t.id,isAdmin:true},screen:'admin',adminWod:null,adminWodEditId:null,adminClassList,lErr:''});
  } else {
    setState({lErr:'아이디 또는 비밀번호가 틀렸습니다.'});
  }
}

    if(memberList.length>0) c.innerHTML+=`<div style="margin-top:8px;background:var(--card2);border-radius:7px;padding:6px 8px;font-size:11px;color:var(--muted)">👥 참여 팀원: ${memberList.join(', ')}</div>`;
  }

  wrap.appendChild(mkBtn('btn-b','margin-bottom:8px;font-size:13px;padding:12px',
    '🎬 시뮬레이션으로 미리보기',
    ()=>setState({screen:'wodSim',adminWodSimId:S.lWodId,simData:null,simSlide:0,simPlaying:false,simFromStudent:true})));
  wrap.appendChild(mkBtn('btn-p','font-size:16px;padding:15px','▶ 운동 시작!',startCountdown));
  wrap.appendChild(mkBtn('btn-s','margin-top:8px','← 돌아가기',()=>{

let cdInt=null, workInt=null;

function startCountdown(){
  clearInterval(cdInt);
  setState({wPhase:'countdown',wCountdown:10});
  cdInt=setInterval(()=>{
    if(S.wCountdown<=1){
      clearInterval(cdInt);
      const wod=getActiveWod();
      const tl=wod.timeLimit||(wod.timeLimitMin||10)*60+(wod.timeLimitSec||0);
      setState({wPhase:'working',aTimeLeft:tl,aSets:0,aRunning:true,aDone:false,aCheckLogs:[],aCooldown:0,aExCooldown:0,aCurExIdx:0,aExLog:[],fElapsed:0,fRunning:true,fDone:false,fSets:0,fSetLogs:[],fCurExIdx:0,fExLog:[],fExCooldown:10,eTimeLeft:60,eRound:1,eRunning:true,eDone:false,eExIdx:0,eRestPhase:false,eRoundLogs:[]});
      startWorkTimer();
      return;
    }
    S.wCountdown--; render();
  },1000);
}

function buildWorkoutCountdown(){
  const wrap=mkDiv('','min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;background:var(--bg);padding:20px');
  wrap.appendChild(mkBtn('','background:none;border:none;color:var(--muted);padding:10px 10px 10px 0;min-width:44px;min-height:44px;display:flex;align-items:center;gap:5px;position:absolute;top:18px;left:18px',ic.back+' 취소',()=>{ clearInterval(cdInt); clearInterval(workInt); setState({screen:'main',wPhase:'ready'}); }));
  const inner=mkDiv('','display:flex;flex-direction:column;align-items:center;gap:13px');
  inner.innerHTML=`<div style="color:var(--muted);font-size:15px;font-weight:600">준비하세요!</div>
    <div class="pulse tf" style="font-size:100px;color:var(--accent);line-height:1">${S.wCountdown}</div>
    <div style="color:var(--muted);font-size:12px">초 후 시작</div>`;
  wrap.appendChild(inner);
  wrap.style.position='relative';
  return wrap;
}

function startWorkTimer(){
  clearInterval(workInt);
  if('wakeLock' in navigator && !window._workWakeLock){
    navigator.wakeLock.request('screen').then(lock=>{window._workWakeLock=lock;}).catch(()=>{});
  }
  const wod=getActiveWod();
  if(wod.type==='AMRAP'){
    workInt=setInterval(()=>{
      if(S.aCooldown>0)S.aCooldown--;
      if(S.aExCooldown>0)S.aExCooldown--;
      if(S.aTimeLeft<=1){
        clearInterval(workInt);
        speak('운동 종료!');
        if(window._workWakeLock){window._workWakeLock.release();window._workWakeLock=null;}
        setState({aTimeLeft:0,aRunning:false,aDone:true});
        return;
      }
      S.aTimeLeft--;
      if(S.aTimeLeft===60) speak('1분 남았습니다!');
      if(S.aTimeLeft===30) speak('30초 남았습니다!');
      if(S.aTimeLeft<=10&&S.aTimeLeft>0){
        if(S.aTimeLeft<=3) speak(String(S.aTimeLeft));
        playBeep(S.aTimeLeft<=3?1200:880, S.aTimeLeft<=3?0.15:0.08, S.aTimeLeft<=3?0.5:0.3);
      }
      render();
    },1000);
  } else if(wod.type==='EMOM'){
    const totalRounds=wod.emomRounds||3;
    workInt=setInterval(()=>{
      if(S.eTimeLeft<=1){
        if(S.eRestPhase){
          if(S.eRound>totalRounds){ clearInterval(workInt); speak('운동 종료!'); if(window._workWakeLock){window._workWakeLock.release();window._workWakeLock=null;} setState({eTimeLeft:0,eRunning:false,eDone:true,eRestPhase:false}); return; }
          S.eRestPhase=false; S.eTimeLeft=60;
        } else {
          S.eRoundLogs=[...(S.eRoundLogs||[]),{round:S.eRound,time:60,auto:true}];
          S.eRound++;
          if(S.eRound>totalRounds){ clearInterval(workInt); speak('운동 종료!'); if(window._workWakeLock){window._workWakeLock.release();window._workWakeLock=null;} setState({eTimeLeft:0,eRunning:false,eDone:true,eRestPhase:false}); return; }
          S.eTimeLeft=60;
        }
        render(); return;
      }
      S.eTimeLeft--;
      if(!S.eRestPhase&&S.eTimeLeft<=10){
        if(S.eTimeLeft<=3){ speak(String(S.eTimeLeft)); playBeep(1200,0.15,0.5); }
        else playBeep(880,0.08,0.3);
      }
      render();
    },1000);
  } else {
    workInt=setInterval(()=>{
      S.fElapsed++;
      if(S.fExCooldown>0) S.fExCooldown--;
      render();
    },1000);
  }
}

        `${i+1}. ${ex}`,()=>{S.aLastExIdx=i;S.srLastExIdx=i;render();});

      exBtns.appendChild(btn);
    });

    // 개수 입력 (운동 선택 후)

      repRow.appendChild(repInp);
      repRow.appendChild(mkDiv('','font-size:14px;color:var(--muted)','개'));
      lastExCard.appendChild(repRow);
      lastExCard.appendChild(mkDiv('','margin-top:8px;font-size:12px;text-align:center;color:var(--red);font-weight:700;background:#ef444415;border-radius:8px;padding:6px',

  hdr.appendChild(backBtn);

    <circle cx="65" cy="65" r="60" fill="none" stroke="var(--border)" stroke-width="6"/>
    <circle cx="65" cy="65" r="60" fill="none" stroke="var(--accent)" stroke-width="6"
      stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-prog)}" stroke-linecap="round" style="transition:stroke-dashoffset .5s linear"/>
  </svg>`;
  const timerInner=mkDiv('','position:absolute;text-align:center');
  timerInner.innerHTML=`<div class="tf" style="font-size:30px">${fmtTime(S.aTimeLeft)}</div><div style="color:var(--muted);font-size:9px">남은 시간</div>`;
  const timerWrap=mkDiv('','position:relative;display:flex;align-items:center;justify-content:center');
  timerWrap.appendChild(timerRow);
  timerWrap.appendChild(timerInner);
  wrap.appendChild(timerWrap);

  // 현재 운동 크게 표시
  // 전체 운동 목록 표시
  const exList=mkDiv('card','margin-bottom:10px');
  exList.innerHTML=`<div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px">🏋️ 아래 운동을 순서대로 모두 완료하세요!</div>
    ${exercises.map((ex,i)=>`<div style="padding:7px 0;border-bottom:${i<exercises.length-1?'1px solid var(--border)':'none'}">
      <div style="font-size:14px;font-weight:700">${i+1}. ${ex}</div>
      <div style="display:flex;gap:6px;margin-top:2px">
        ${(wod.exerciseRx||[])[i]?`<span style="font-size:11px;color:var(--blue);font-weight:700">💪 RxD: ${(wod.exerciseRx||[])[i]}</span>`:''}
        ${(wod.exerciseScale||[])[i]?`<span style="font-size:11px;color:var(--green);font-weight:700">🔧 Scaled: ${(wod.exerciseScale||[])[i]}</span>`:''}
        ${(wod.exerciseBasic||[])[i]?`<span style="font-size:11px;color:var(--yellow);font-weight:700">⭐ Basic: ${(wod.exerciseBasic||[])[i]}</span>`:''}

  hbtn.className='hbtn';
  hbtn.style.cssText='background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;font-size:14px;margin-bottom:7px';
  hbtn.disabled=!canCheck;
  if(S.aCooldown>0){
    hbtn.innerHTML=`<span style="font-size:12px;opacity:.7">⏳ 세트 완료까지 ${S.aCooldown}초</span>`;

    hbtn.innerHTML=`<div class="hprog" id="hprog" style="width:0%"></div><span style="position:relative;z-index:1">1초 길게 눌러 세트 완료</span><span style="position:relative;z-index:1;font-size:10px;opacity:.7" id="hpct"></span>`;
  }
  function startHold(){
    if(!canCheck||window._holdActive) return;
    window._holdActive=true;
    const holdStart=Date.now();
    const pe=document.getElementById('hprog');
    const pce=document.getElementById('hpct');
    window._holdAnim=setInterval(()=>{
      const pct=Math.min(100,Math.floor((Date.now()-holdStart)/10));
      if(pe) pe.style.width=pct+'%';
      if(pce) pce.textContent=pct<100?`누르는 중... ${pct}%`:'✅ 완료!';
      if(pct>=100){
        clearInterval(window._holdAnim);
        window._holdAnim=null;
        window._holdActive=false;
        completeAmrapSet();
      }
    },30);
  }
  function endHold(){
    if(window._holdAnim){
      clearInterval(window._holdAnim);
      window._holdAnim=null;
    }
    window._holdActive=false;
    const p=document.getElementById('hprog');
    if(p) p.style.width='0%';
    const pc=document.getElementById('hpct');
    if(pc) pc.textContent='';
  }
  hbtn.addEventListener('mousedown',startHold);
  hbtn.addEventListener('mouseup',endHold);
  hbtn.addEventListener('mouseleave',endHold);
  hbtn.addEventListener('touchstart',e=>{e.preventDefault();startHold();},{passive:false});
  hbtn.addEventListener('touchend',e=>{e.preventDefault();endHold();},{passive:false});
  hbtn.addEventListener('touchcancel',endHold);
  wrap.appendChild(hbtn);

  const ctrl=mkDiv('','display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px');

  }));

  wrap.appendChild(ctrl);
  // 기록 저장은 운동 종료(aDone) 후에만 가능 - 종료 화면에서 버튼 표시
  return wrap;
}

function completeAmrapSet(){
  if(window._completingSet) return; // 중복 실행 방지
  window._completingSet=true;
  setTimeout(()=>{window._completingSet=false;},500);
  const wod=getActiveWod();
  const tl=wod.timeLimit||(wod.timeLimitMin||10)*60+(wod.timeLimitSec||0);
  const elapsed=tl-S.aTimeLeft;
  const prevLog=S.aCheckLogs[S.aCheckLogs.length-1]||null;
  const abnormal=prevLog&&(elapsed-prevLog.elapsed)<10;
  S.aSets++;
  S.aCheckLogs=[...S.aCheckLogs,{set:S.aSets,elapsed,timeLeft:S.aTimeLeft,createdAt:new Date().toISOString(),abnormal}];
  S.aCooldown=10;
  S.aCurExIdx=0;
  showToast(abnormal?'⚠️ 너무 빠른 체크!':'✅ 세트 완료!',abnormal?'error':'success');
}

              :`<span style="font-size:12px;font-weight:700;color:var(--green)">운동 ${l.time}초</span>
